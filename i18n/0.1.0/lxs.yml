contract:
  version: 2
  api: 'i18n: GET /api/i18n/locales + GET /api/i18n/catalog/:locale/:namespace + GET /api/i18n/health'
  env:
    required:
    - SERVER_PORT
    optional:
    - DEFAULT_LOCALE
    - LOCALES
    defaults:
      DEFAULT_LOCALE: en
      LOCALES: en,id
    fields:
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the i18n service listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      DEFAULT_LOCALE:
        required: false
        type: string
        default: en
        description: Fallback locale served when a request does not name one
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      LOCALES:
        required: false
        type: csv
        default: en,id
        description: Locales this instance exposes (comma-separated ISO-639 codes)
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound: []
  resources:
    memory: 16m
    disk: 32m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
