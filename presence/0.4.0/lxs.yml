contract:
  version: 2
  api: 'presence: GET /api/health, GET /api/stats, POST /api/event, GET /api/stream (SSE)'
  env:
    required:
    - SERVER_PORT
    optional:
    - CORS_ALLOWED_ORIGINS
    - PRESENCE_GEO_DB
    - PRESENCE_GEO_URL
    - PRESENCE_DATA_DIR
    - REDIS_URL
    defaults: {}
    fields:
      CORS_ALLOWED_ORIGINS:
        required: false
        type: csv-url
        default: ''
        description: Origins allowed to call this API
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: cors-origins
        example: ''
      PRESENCE_GEO_URL:
        required: false
        type: string
        default: ''
        description: HTTP geo lookup base when no offline DB is set (default http://ip-api.com/json).
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      PRESENCE_GEO_DB:
        required: false
        type: string
        default: ''
        description: Absolute path to an ip->city MaxMind-DB (.mmdb) for offline geo (GeoLite2-City or DB-IP Lite). Empty = use PRESENCE_GEO_URL.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      PRESENCE_DATA_DIR:
        required: false
        type: string
        default: ''
        description: Directory for daily pulse logs (/<UTC-date>.ndjson) backing GET /api/replay.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the presence service listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      REDIS_URL:
        required: false
        type: string
        default: ''
        description: Redis URL. When set, pulses fan out across replicas (pub/sub) and counters are atomic in Redis — enables N presence replicas behind the gateway. Empty = single-process.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound: []
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
