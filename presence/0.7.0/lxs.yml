contract:
  version: 2
  api: 'presence: GET /api/health, GET /api/stats, POST /api/event (signin|signup|ping), GET /api/stream (SSE)'
  env:
    required:
    - SERVER_PORT
    optional:
    - CORS_ALLOWED_ORIGINS
    - PRESENCE_GEO_DB
    - PRESENCE_GEO_URL
    - PRESENCE_DATA_DIR
    - REDIS_URL
    - PRESENCE_ONLINE_WINDOW_SECS
    defaults: {}
    fields:
      PRESENCE_GEO_URL:
        required: false
        type: string
        default: ''
        description: HTTP geo lookup base when no offline DB is set (default http://ip-api.com/json).
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      PRESENCE_DATA_DIR:
        required: false
        type: string
        default: ''
        description: Directory for daily pulse logs (/<UTC-date>.ndjson) backing GET /api/replay.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      CORS_ALLOWED_ORIGINS:
        required: false
        type: csv-url
        default: ''
        description: Origins allowed to call this API
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: cors-origins
        example: ''
      PRESENCE_GEO_DB:
        required: false
        type: string
        default: ''
        description: Absolute path to an ip->city MaxMind-DB (.mmdb) for offline geo (GeoLite2-City or DB-IP Lite). Empty = use PRESENCE_GEO_URL.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the presence service listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      REDIS_URL:
        required: false
        type: string
        default: ''
        description: Redis URL. When set, pulses fan out across replicas (pub/sub) and counters are atomic in Redis — enables N presence replicas behind the gateway. Empty = single-process.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      PRESENCE_ONLINE_WINDOW_SECS:
        required: false
        type: int
        default: ''
        description: Seconds a member counts as online after their last pulse/heartbeat (default 180, min 30). Clients ping about every 60s.
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound: []
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: github-getecosphere:getecosphere/presence.git
  commit: 03e53d17aba3eb6b7d27f5807f3f4c3dc606f0b5
