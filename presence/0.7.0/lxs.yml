name: presence
domain: presence
version: 0.7.0
publisher: getecosphere
status: verified
license: mit
summary: 'Realtime presence hub — fan-out join/login pulses over SSE to light up the RWID globe (privacy-first: first name only)'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/presence
    sha256: 3924ee5a4d5db6ee49e28297881bc1eaa975648e4e921c32cf9c0fd9f677e3f6
    size: 4663512
  darwin/arm64:
    path: darwin-arm64/presence
    sha256: bf54c568198c0ee235d76232a02a916f9e7fba135397da3a1b883df708469010
