compose:
  service:
    name: presence-backend
    port: 4200
    grants:
      secrets: []
    config: {}
    access:
      routes:
      - path: /api/presence/event
        level: public
        strip: /api/presence
        rewrite: /api
        cookie: ''
      - path: /api/presence/stats
        level: public
        strip: /api/presence
        rewrite: /api
        cookie: ''
      - path: /api/presence/replay
        level: public
        strip: /api/presence
        rewrite: /api
        cookie: ''
      - path: /api/presence/stream
        level: public
        strip: /api/presence
        rewrite: /api
        cookie: ''
      - path: /api/presence/health
        level: public
        strip: /api/presence
        rewrite: /api
        cookie: ''
  auth:
    email_verification:
      enabled: null
