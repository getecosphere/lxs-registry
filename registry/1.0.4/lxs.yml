name: registry
domain: registry
version: 1.0.4
publisher: getecosphere
status: verified
license: mit
summary: LXS Registry — browse and categorize versioned Linux Services from the getecosphere/lxs-registry repository (single binary serves the browse UI and the JSON API)
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/registry
    sha256: ccad7c0918fcee5b4b99eab02ba442d99279f189126969445fe77e1432fbd916
    size: 2508936
contract:
  version: 1
  api: registry browse UI (/, /lxs/:name) + JSON API (/api/lxs, /api/lxs/categories, /api/lxs/:name)
  env:
    required:
    - SERVER_PORT
    - LXS_REGISTRY_CACHE
    optional:
    - PORT
    defaults: {}
    fields: {}
  db: none
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 512m
    startup_seconds: 10
  health:
    path: ''
    readiness: ''
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - git
provenance:
  source: https://github.com/getecosphere/registry.git
  commit: 12dc5ab5c22476d17594bcd136073018d6a09803
  built_by: eco@0.4.5
  built_at: 2026-10-13T03:12:22Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.4
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
compose:
  service:
    name: ''
    port: 0
    grants:
      secrets: []
    config: {}
    access:
      routes: []
  auth:
    email_verification:
      enabled: null
attestation: 3ugfJMYfaotuCUVwzoIJN2NxLcNpAaWZauBxSwxShSyvUXF6OJIdtymfQadiW6O46Jo5dxDjdWnAjH601g6rBw==
signing_key: qVfnrX+hYBsmPKKQWDwbnUrIsORvjMTxNO0YUR76Nv8=
