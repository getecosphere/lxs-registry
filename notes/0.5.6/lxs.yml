name: notes
domain: notes
version: 0.5.6
publisher: getecosphere
status: unverified
license: mit
summary: notes — macOS-Notes-style per-user notes (MongoDB) with a self-contained UI
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/notes
    sha256: 43b214c5396e09d0c771723da3894d56e942c0d3bd605b1702aeee20f82ffecd
    size: 12010704
  linux/amd64:
    path: linux-amd64/notes
    sha256: f2878416d170a4f6d4046b87a75cc8ebfc2201e8f8f21a4a355395a0e49ca9c7
    size: 10303048
contract:
  version: 1
  api: 'notes: GET/POST /api/notes, PUT/DELETE /api/notes/{id}, GET /api/notes/quota, POST/DELETE /api/notes/{id}/images, GET /notes-app (UI)'
  env:
    required:
    - MONGODB_URI
    - JWT_SECRET
    - SERVER_PORT
    optional: []
    defaults: {}
    fields: {}
  db: mongodb
  network:
    inbound:
    - http
    outbound: []
  resources:
    memory: 64m
    disk: 64m
    startup_seconds: 5
  health:
    path: /api/health
    readiness: /api/health
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: git@github.com:getecosphere/notes.git
  commit: 952abaed0fb1bab775343bf94bccb67ae0cc937e
  built_by: eco@0.4.4
  built_at: 2026-09-30T00:19:51Z
  target: x86_64-unknown-linux-musl
release:
- 0.5.6
docs:
- README.md
- api.md
- changelog.md
compose:
  service:
    name: notes-backend
    port: 4301
    grants:
      secrets:
      - JWT_SECRET
      - MONGODB_URI
    config: {}
    access:
      routes:
      - path: /notes-app
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /notes-app/*
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /api/notes
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /api/notes/*
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
  auth:
    email_verification:
      enabled: null
