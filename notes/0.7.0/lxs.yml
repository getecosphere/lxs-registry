name: notes
domain: notes
version: 0.7.0
publisher: getecosphere
status: unverified
license: mit
summary: notes — macOS-Notes-style per-user notes (MongoDB) with a self-contained UI
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/notes
    sha256: 2aaad4c97344e5b5d4a24555b53fb12d10e66cc080bc7bdd90a39a86bf3ae007
    size: 10307144
  darwin/arm64:
    path: darwin-arm64/notes
    sha256: f39b79b1bf1f6c787a410066aff34b1c8caef5d44b6557dd1c647673e6e78544
