name: notes
domain: notes
version: 0.5.1
publisher: getecosphere
status: unverified
license: mit
summary: notes — macOS-Notes-style per-user notes (MongoDB) with a self-contained UI
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/notes
    sha256: 157be31902512c2e200650b4a1e6962775eacf0503c0ff9e404d8f260d273bcc
    size: 12010704
  linux/amd64:
    path: linux-amd64/notes
    sha256: 2ad8aead7f0efd9553ed4f5fe315a0c789426c7b94200e53c555f51883858f14
