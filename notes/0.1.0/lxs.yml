name: notes
domain: notes
version: 0.1.0
publisher: getecosphere
status: unverified
license: mit
summary: notes — macOS-Notes-style per-user notes (MongoDB) with a self-contained UI
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/notes
    sha256: 6f1968acc3e7e8934cb6444e095d476eac24d6fa4cd2ac1a40568c00d18002b1
    size: 11351568
  linux/amd64:
    path: linux-amd64/notes
    sha256: 5ff6f3c43c757fe90a6bde00d914a8520df7ed01ca7648184c8c5997197ffeb3
    size: 9741608
contract:
  version: 1
  api: 'notes: GET/POST /api/notes, PUT/DELETE /api/notes/{id}, GET /notes-app (UI)'
  env:
    required:
    - SERVER_PORT
    optional: []
    defaults: {}
    fields: {}
  db: mongodb
  network:
    inbound:
    - http
    outbound: []
  resources:
    memory: 64m
    disk: 64m
    startup_seconds: 5
  health:
    path: /api/health
    readiness: /api/health
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: ''
  commit: e06a21a9e63b66d51c6dfc3fc85fd6b71fa51abb
  built_by: eco@0.4.4
  built_at: 2026-09-29T22:12:51Z
  target: x86_64-unknown-linux-musl
release:
- 0.1.0
docs:
- README.md
- api.md
- changelog.md
compose:
  service:
    name: notes-backend
    port: 4301
    grants:
      secrets:
      - JWT_SECRET
      - MONGODB_URI
    config: {}
    access:
      routes:
      - path: /notes-app
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /notes-app/*
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /api/notes
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /api/notes/*
        level: auth
        strip: ''
        rewrite: ''
        cookie: eco_token
  auth:
    email_verification:
      enabled: null
