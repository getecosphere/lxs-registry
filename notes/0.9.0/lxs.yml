status: unverified
license: mit
summary: notes — macOS-Notes-style per-user notes (MongoDB) with a self-contained UI
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/notes
    sha256: 68dea6bdb1513fec649bad6b6c06119d7869ac9f798615513304b7f90d0ec960
