name: email-manager
domain: email-manager
version: 4.1.0
publisher: stuff8
status: verified
license: mit
summary: 'Email for an estate: branded templates with an admin UI (draft, preview, publish, history), queued delivery via Brevo, suppression, GDPR retention and erasure, one-click unsubscribe'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/email-manager
    sha256: 72025f4899db09506e8101555487e4241d376ac8b03ed4682e20d6ce504bb39a
    size: 17996000
  linux/amd64:
    path: linux-amd64/email-manager
    sha256: 74f28201055b054f0ced9d3bd9b4dc0bcdbe0fffa33a2adca38ff0512d261bfa
    size: 15547184
contract:
  version: 1
  api: 'service API /api/email/* (Bearer EMAIL_SERVICE_TOKEN): send, batch, send-template, templates, templates/defaults (domains register their own), status, unsubscribe, privacy/export, privacy/erase · admin UI /email-admin (role:superadmin) · public /email/unsubscribe'
  env:
    required:
    - SERVER_PORT
    - API_BASE_PATH
    - MONGODB_URI
    - BREVO_API_KEY
    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    optional:
    - EMAIL_PER_RECIPIENT_DAY
    - EMAIL_GLOBAL_PER_HOUR
    - EMAIL_WARMUP_MAX_PER_HOUR
    - EMAIL_WARMUP_DAYS
    - EMAIL_SERVICE_TOKEN
    - AUTH_BASE_URL
    - EMAIL_MANAGER_PUBLIC_URL
    - EMAIL_BRAND_NAME
    - EMAIL_BRAND_URL
    - EMAIL_BRAND_LOGO_URL
    - EMAIL_BRAND_COLOR
    - EMAIL_BRAND_TAGLINE
    - EMAIL_SUPPORT_EMAIL
    - EMAIL_POSTAL_ADDRESS
    - EMAIL_BODY_RETENTION_DAYS
    - EMAIL_LOG_RETENTION_DAYS
    - MAIL_FROM_ALLOWED
    defaults: {}
    fields: {}
  db: mongodb@7
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 256m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/email-manager.git
  commit: f36a117debfbb29cfb67cdd79bb1e77aecfbe3d4
  built_by: eco@0.4.9
  built_at: 2026-10-17T05:03:57Z
  target: x86_64-unknown-linux-musl
release:
- 4.1.0
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
compose:
  service:
    name: email-manager-backend
    port: 4210
    grants:
      secrets:
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
      - EMAIL_SERVICE_TOKEN
    config: {}
    access:
      routes:
      - path: /email-admin
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email-admin/*
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email/unsubscribe
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
attestation: QpZFbfc9TQUAf3eKaRVacngbbRdKZF+xGZsJk8oackC/1HM19m0dpRBlrk/1PZ0l0+2eoJdm3P68DBESIMyEAA==
signing_key: qVfnrX+hYBsmPKKQWDwbnUrIsORvjMTxNO0YUR76Nv8=
