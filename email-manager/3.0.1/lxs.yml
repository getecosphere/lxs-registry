name: email-manager
domain: email-manager
version: 3.0.1
publisher: stuff8
status: verified
license: mit
summary: 'Email for an estate: branded templates with an admin UI (draft, preview, publish, history), queued delivery via Brevo, suppression, GDPR retention and erasure, one-click unsubscribe'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/email-manager
    sha256: b25d377cc938366019ba1c5d0e5a201e1800acccc0a61ce4461c3181e873678a
    size: 17862464
  linux/amd64:
    path: linux-amd64/email-manager
    sha256: 72e8a4545a6b2dc22512bcf8fe87fe0aadd7df5a0ee73a1b2e04a3e05ace52dd
    size: 15457848
contract:
  version: 1
  api: 'service API /api/email/* (Bearer EMAIL_SERVICE_TOKEN): send, batch, send-template, templates, status, unsubscribe, privacy/export, privacy/erase · admin UI /email-admin (role:superadmin) · public /email/unsubscribe'
  env:
    required:
    - SERVER_PORT
    - API_BASE_PATH
    - MONGODB_URI
    - BREVO_API_KEY
    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    optional:
    - EMAIL_PER_RECIPIENT_DAY
    - EMAIL_GLOBAL_PER_HOUR
    - EMAIL_WARMUP_MAX_PER_HOUR
    - EMAIL_WARMUP_DAYS
    - EMAIL_SERVICE_TOKEN
    - AUTH_BASE_URL
    - EMAIL_MANAGER_PUBLIC_URL
    - EMAIL_BRAND_NAME
    - EMAIL_BRAND_URL
    - EMAIL_BRAND_LOGO_URL
    - EMAIL_BRAND_COLOR
    - EMAIL_BRAND_TAGLINE
    - EMAIL_SUPPORT_EMAIL
    - EMAIL_POSTAL_ADDRESS
    - EMAIL_BODY_RETENTION_DAYS
    - EMAIL_LOG_RETENTION_DAYS
    defaults: {}
    fields: {}
  db: mongodb@7
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 256m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/email-manager.git
  commit: 568f0fd68a22d6255eec4a93381200b7751b2065
  built_by: eco@0.4.6
  built_at: 2026-10-15T12:18:59Z
  target: x86_64-unknown-linux-musl
release:
- 3.0.1
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
compose:
  service:
    name: email-manager-backend
    port: 4210
    grants:
      secrets:
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
      - EMAIL_SERVICE_TOKEN
    config: {}
    access:
      routes:
      - path: /email-admin
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email-admin/*
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email/unsubscribe
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
attestation: i2bmlxsP22zcX9FGTA9GrTqoASK9rRdrfQsT2TeWAGIjygd5yFfosTEvwN0esuG3P3hyEf6PmhHnvtETgZj6AA==
signing_key: qVfnrX+hYBsmPKKQWDwbnUrIsORvjMTxNO0YUR76Nv8=
