name: email-manager
domain: email-manager
version: 4.2.1
publisher: stuff8
status: verified
license: mit
summary: 'Email for an estate: branded templates with an admin UI (draft, preview, publish, history), campaigns (compose with images, audio, video and attachments, preview, send to all members or a selection, now or scheduled), queued delivery via Brevo, suppression, GDPR retention and erasure, one-click unsubscribe'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/email-manager
    sha256: 848463c43671da09383c51faf0b408ea7d7c757b2da60a4127e2a623a535cd54
    size: 19497168
  linux/amd64:
    path: linux-amd64/email-manager
    sha256: aca2a306fcabeb38f2c70855052a088598b37813d8a059c8a549ac1bcc6abbed
    size: 17096976
contract:
  version: 1
  api: 'service API /api/email/* (Bearer EMAIL_SERVICE_TOKEN): send, batch, send-template, templates, templates/defaults (domains register their own), status, unsubscribe, privacy/export, privacy/erase · admin UI /email-admin (role:superadmin; templates, campaigns, media) · public /email/unsubscribe and /email/media/*'
  env:
    required:
    - SERVER_PORT
    - API_BASE_PATH
    - MONGODB_URI
    - BREVO_API_KEY
    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    optional:
    - EMAIL_PER_RECIPIENT_DAY
    - EMAIL_GLOBAL_PER_HOUR
    - EMAIL_WARMUP_MAX_PER_HOUR
    - EMAIL_WARMUP_DAYS
    - EMAIL_SERVICE_TOKEN
    - AUTH_BASE_URL
    - EMAIL_MANAGER_PUBLIC_URL
    - EMAIL_BRAND_NAME
    - EMAIL_BRAND_URL
    - EMAIL_BRAND_LOGO_URL
    - EMAIL_BRAND_COLOR
    - EMAIL_BRAND_TAGLINE
    - EMAIL_SUPPORT_EMAIL
    - EMAIL_POSTAL_ADDRESS
    - EMAIL_BODY_RETENTION_DAYS
    - EMAIL_LOG_RETENTION_DAYS
    - MAIL_FROM_ALLOWED
    defaults: {}
    fields: {}
  db: mongodb@7
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 256m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/email-manager.git
  commit: 34f310511a750468c5962a41556e30a3d7599213
  built_by: eco@0.4.9
  built_at: 2026-10-19T11:42:25Z
  target: x86_64-unknown-linux-musl
release:
- 4.2.1
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
compose:
  service:
    name: email-manager-backend
    port: 4210
    grants:
      secrets:
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
      - EMAIL_SERVICE_TOKEN
    config: {}
    access:
      routes:
      - path: /email-admin
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email-admin/*
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /email/unsubscribe
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /email/media/*
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
attestation: YOF2tpwBAvUaU4emt2o8lxxAac3CsSYCr7Cy0tEDrphuDag6IVR4e62jD+ihIOwkppULfzdrHqcCBvmQV1nYAQ==
signing_key: qVfnrX+hYBsmPKKQWDwbnUrIsORvjMTxNO0YUR76Nv8=
