name: gateway
domain: gateway
version: 3.8.1
publisher: stuff8
status: unverified
license: mit
summary: 'Estate front door: default-deny HTTP reverse-proxy + authorization middleware (JWT, roles, single-session, strip/rewrite), upstream pool (round-robin + passive health + connect-failure failover/retry), SIGHUP hot-reload, /healthz+/readyz, HTTP→HTTPS redirect, optional pre-release gate (redirect all non-exempt paths to a launch page), baseline security headers, with content-negotiated HTML/JSON error pages'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/gateway
    sha256: 9793d8b019cae848590374ebcc38c28b889e5a7efd14b5613a956b58401ff37f
    size: 5799584
  linux/amd64:
    path: linux-amd64/gateway
    sha256: c77912767076d868ccbf025100967011b901d0b12d26d05681669909ee5dc237
    size: 4647168
contract:
  version: 2
  api: 'gateway: HTTP reverse-proxy + ACL; routes from GATEWAY_CONFIG'
  env:
    required:
    - SERVER_PORT
    - JWT_SECRET
    - GATEWAY_CONFIG
    optional:
    - AUTH_SESSION_CHECK_URL
    - SESSION_REQUIRED
    defaults:
      SESSION_REQUIRED: 'true'
    fields:
      SESSION_REQUIRED:
        required: false
        type: bool
        default: 'true'
        description: Reject bearer tokens without a session id (legacy pre-session tokens). Mirrors auth's SESSION_REQUIRED.
        group: session
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      JWT_SECRET:
        required: true
        type: secret
        default: ''
        description: HS512 signing key shared with the estate's auth service
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: shared-jwt
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the gateway listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      AUTH_SESSION_CHECK_URL:
        required: false
        type: url
        default: ''
        description: Auth session-status endpoint; the gateway re-validates each protected token's session here (single-session enforcement)
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: auth-session-check
        example: ''
      GATEWAY_CONFIG:
        required: true
        type: json
        default: ''
        description: Path to the gateway.json route/ACL config written by configgen
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
