contract:
  version: 2
  api: 'gateway: HTTP reverse-proxy + ACL; routes from GATEWAY_CONFIG'
  env:
    required:
    - SERVER_PORT
    - JWT_SECRET
    - GATEWAY_CONFIG
    optional:
    - AUTH_SESSION_CHECK_URL
    - SESSION_REQUIRED
    defaults:
      SESSION_REQUIRED: 'true'
    fields:
      SESSION_REQUIRED:
        required: false
        type: bool
        default: 'true'
        description: Reject bearer tokens without a session id (legacy pre-session tokens). Mirrors auth's SESSION_REQUIRED.
        group: session
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the gateway listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      JWT_SECRET:
        required: true
        type: secret
        default: ''
        description: HS512 signing key shared with the estate's auth service
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: shared-jwt
        example: ''
      GATEWAY_CONFIG:
        required: true
        type: json
        default: ''
        description: Path to the gateway.json route/ACL config written by configgen
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      AUTH_SESSION_CHECK_URL:
        required: false
        type: url
        default: ''
        description: Auth session-status endpoint; the gateway re-validates each protected token's session here (single-session enforcement)
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: auth-session-check
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
