name: gateway
domain: gateway
version: 3.2.0
publisher: stuff8
status: verified
license: mit
summary: 'Estate front door: default-deny HTTP reverse-proxy + authorization middleware (JWT, roles, single-session, strip/rewrite), HTTP→HTTPS redirect, with content-negotiated HTML/JSON error pages'
targets:
- darwin/arm64
- linux/amd64
artifacts:
