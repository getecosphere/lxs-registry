name: gateway
domain: gateway
version: 3.12.0
publisher: stuff8
status: unverified
license: mit
summary: 'Estate front door: default-deny HTTP reverse-proxy + authorization middleware (JWT, roles, single-session, strip/rewrite), upstream pool (round-robin + passive health + connect-failure failover/retry), origin overload protection (per-IP rate limit → 429, per-IP/total in-flight caps → 503), SIGHUP hot-reload, /healthz+/readyz, NDJSON access logs, HTTP→HTTPS redirect, optional pre-release gate, baseline security headers, content-negotiated HTML/JSON error pages'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/gateway
    sha256: 40a14260d8d50db15d8979fedba2c6ccc4f84c97a7c10149b7ece364c8650292
    size: 5872208
  linux/amd64:
    path: linux-amd64/gateway
    sha256: f520ccd9644431901b7c60763fb5490f259aa57f1811612de36ba0cf2d0161df
    size: 4700560
contract:
  version: 2
  api: 'gateway: HTTP reverse-proxy + ACL; routes from GATEWAY_CONFIG'
  env:
    required:
    - SERVER_PORT
    - JWT_SECRET
    - GATEWAY_CONFIG
    optional:
    - AUTH_SESSION_CHECK_URL
    - SESSION_REQUIRED
    - RATE_LIMIT_RPS
    - RATE_LIMIT_BURST
    - MAX_INFLIGHT_PER_IP
    - MAX_INFLIGHT_TOTAL
    - ACCESS_LOG
    defaults:
      MAX_INFLIGHT_PER_IP: '0'
      MAX_INFLIGHT_TOTAL: '0'
      ACCESS_LOG: 'true'
      RATE_LIMIT_BURST: '0'
      RATE_LIMIT_RPS: '0'
      SESSION_REQUIRED: 'true'
    fields:
      AUTH_SESSION_CHECK_URL:
        required: false
        type: url
        default: ''
        description: Auth session-status endpoint; the gateway re-validates each protected token's session here (single-session enforcement)
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: auth-session-check
        example: ''
      MAX_INFLIGHT_PER_IP:
        required: false
        type: int
        default: '0'
        description: Max concurrent in-flight requests per client IP. 0 = disabled. Protects against slow-loris / connection pile-up from one source.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      RATE_LIMIT_RPS:
        required: false
        type: int
        default: '0'
        description: Origin-side per-client-IP request rate (req/s, token bucket). 0 = disabled. Backstop for a distributed flood Cloudflare cannot shed per-IP.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      MAX_INFLIGHT_TOTAL:
        required: false
        type: int
        default: '0'
        description: Max concurrent in-flight requests across all clients → 503 past the cap. 0 = disabled. The origin's load-shedding backstop.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      ACCESS_LOG:
        required: false
        type: bool
        default: 'true'
        description: Emit one NDJSON access-log line per request (method/path/status/latency/client_ip). Never logs tokens, cookies, or bodies.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the gateway listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      JWT_SECRET:
        required: true
        type: secret
        default: ''
        description: HS512 signing key shared with the estate's auth service
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: shared-jwt
        example: ''
      RATE_LIMIT_BURST:
        required: false
        type: int
        default: '0'
        description: Token-bucket burst per IP. 0 with RATE_LIMIT_RPS>0 → 2× rps (min 10).
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      GATEWAY_CONFIG:
        required: true
        type: json
        default: ''
        description: Path to the gateway.json route/ACL config written by configgen
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      SESSION_REQUIRED:
        required: false
        type: bool
        default: 'true'
        description: Reject bearer tokens without a session id (legacy pre-session tokens). Mirrors auth's SESSION_REQUIRED.
        group: session
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
  health:
    path: ''
    readiness: ''
