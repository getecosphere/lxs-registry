name: gateway
domain: gateway
version: 3.16.0
publisher: stuff8
status: verified
license: mit
summary: 'Estate front door: default-deny HTTP reverse-proxy + authorization middleware (JWT, roles, single-session, strip/rewrite), upstream pool (round-robin + passive health + connect-failure failover/retry), origin overload protection (per-IP rate limit → 429, per-IP/total in-flight caps → 503), SIGHUP hot-reload, /healthz+/readyz, loopback-only /internal/metrics (rolling origin rps/status/top-IPs for the host breach guard), NDJSON access logs, HTTP→HTTPS redirect, optional pre-release gate, baseline security headers, content-negotiated HTML/JSON error pages'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/gateway
    sha256: d1f95036e2b416846b94f8891d5db2564223530cdbc856ed0cef23a11d2cd810
    size: 6412920
  darwin/arm64:
    path: darwin-arm64/gateway
    sha256: 76456d0ebe09e2065c31b5a1360d1b3441440b531aaac5a85495fc559a3acaa5
    size: 7760096
contract:
  version: 2
  api: 'gateway: HTTP reverse-proxy + ACL; routes from GATEWAY_CONFIG'
  env:
    required:
    - SERVER_PORT
    - JWT_SECRET
    - GATEWAY_CONFIG
    optional:
    - AUTH_SESSION_CHECK_URL
    - SESSION_REQUIRED
    - RATE_LIMIT_RPS
    - RATE_LIMIT_BURST
    - MAX_INFLIGHT_PER_IP
    - MAX_INFLIGHT_TOTAL
    - ACCESS_LOG
    defaults:
      RATE_LIMIT_RPS: '0'
      SESSION_REQUIRED: 'true'
      MAX_INFLIGHT_PER_IP: '0'
      MAX_INFLIGHT_TOTAL: '0'
      ACCESS_LOG: 'true'
      RATE_LIMIT_BURST: '0'
    fields:
      BIND_ADDR:
        required: false
        type: string
        default: ''
        description: Listen address. Empty = 0.0.0.0. An RWID/OS device sets 127.0.0.1 so no network port is open.
        group: device
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      JWT_SECRET:
        required: true
        type: secret
        default: ''
        description: HS512 signing key shared with the estate's auth service
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: shared-jwt
        example: ''
      RATE_LIMIT_BURST:
        required: false
        type: int
        default: '0'
        description: Token-bucket burst per IP. 0 with RATE_LIMIT_RPS>0 → 2× rps (min 10).
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      REMOTE_TOKEN_FILE:
        required: false
        type: string
        default: ''
        description: File holding the bearer attached to `remote:` routes (an auth PAT on an RWID/OS device). Read per request; never sent to local upstreams or returned to clients.
        group: device
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      GATEWAY_CONFIG:
        required: true
        type: json
        default: ''
        description: Path to the gateway.json route/ACL config written by configgen
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      MAX_INFLIGHT_PER_IP:
        required: false
        type: int
        default: '0'
        description: Max concurrent in-flight requests per client IP. 0 = disabled. Protects against slow-loris / connection pile-up from one source.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      RATE_LIMIT_RPS:
        required: false
        type: int
        default: '0'
        description: Origin-side per-client-IP request rate (req/s, token bucket). 0 = disabled. Backstop for a distributed flood Cloudflare cannot shed per-IP.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      ACCESS_LOG:
        required: false
        type: bool
        default: 'true'
        description: Emit one NDJSON access-log line per request (method/path/status/latency/client_ip). Never logs tokens, cookies, or bodies.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      AUTH_SESSION_CHECK_URL:
        required: false
        type: url
        default: ''
        description: Auth session-status endpoint; the gateway re-validates each protected token's session here (single-session enforcement)
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: auth-session-check
        example: ''
      SERVER_PORT:
        required: true
        type: int
        default: ''
        description: Port the gateway listens on
        group: ''
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: port
        example: ''
      SESSION_REQUIRED:
        required: false
        type: bool
        default: 'true'
        description: Reject bearer tokens without a session id (legacy pre-session tokens). Mirrors auth's SESSION_REQUIRED.
        group: session
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      MAX_INFLIGHT_TOTAL:
        required: false
        type: int
        default: '0'
        description: Max concurrent in-flight requests across all clients → 503 past the cap. 0 = disabled. The origin's load-shedding backstop.
        group: overload
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
      ALLOWED_HOSTS:
        required: false
        type: string
        default: ''
        description: Comma-separated hostnames this gateway serves (e.g. 127.0.0.1,localhost on a device). Empty = any host. When set, a foreign Host is refused (DNS rebinding) and a state-changing request with a foreign or null Origin is refused (CSRF).
        group: device
        choices: []
        min: 0.0
        max: 0.0
        pattern: ''
        secret: false
        managed: ''
        example: ''
  db: none
  network:
    inbound:
    - http
    outbound:
