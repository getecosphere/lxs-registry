name: storage
domain: storage
version: 2.2.0
publisher: stuff8
status: verified
license: mit
summary: 'Photos & media: uploads, image/video/audio processing, S3 storage, thumbnails'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/storage
    sha256: f2c32ac646f0f5464665108db72dadb382a5345f6640a0eed63a5076c95735e9
