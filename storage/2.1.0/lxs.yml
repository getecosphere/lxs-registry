name: storage
domain: storage
version: 2.1.0
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video/audio processing, S3 storage, thumbnails'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/storage
    sha256: a37693b699a77bcdfe7e142ccdec01cc6952512942c89fcd5a974d4a8b81138e
