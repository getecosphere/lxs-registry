    required:
    - SERVER_PORT
    optional:
    - AUTH_API_BASE
    - AUTH_REDIRECT_URL
    defaults: {}
    fields: {}
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/auth-ui.git
  commit: 1c9c6cd1270b14799cff9887684042e37f38a639
  built_by: eco@0.4.4
  built_at: 2026-09-26T10:30:48Z
  target: x86_64-unknown-linux-musl
release:
- 3.4.1
docs:
- README.md
- api.md
- changelog.md
- gotchas.md
compose:
  service:
    name: auth-ui
    port: 4201
    grants:
      secrets: []
    config: {}
    access:
      routes:
      - path: /signin
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /signup
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /forgot-password
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /reset-password
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /verify-email
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /users
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /static/auth-ui.css
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
