name: auth-ui
domain: auth
version: 3.4.1
publisher: stuff8
status: unverified
license: mit
summary: White-label signin, signup, and password recovery pages for the auth domain (Leptos SSR)
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
