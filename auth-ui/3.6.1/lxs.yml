name: auth-ui
domain: auth
version: 3.6.1
publisher: stuff8
status: unverified
license: mit
summary: White-label signin, signup, and password recovery pages for the auth domain (Leptos SSR)
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/auth-ui
