  built_by: eco@0.4.4
  built_at: 2026-09-29T05:02:00Z
  target: x86_64-unknown-linux-musl
release:
- 3.6.1
docs:
- README.md
- api.md
- changelog.md
- gotchas.md
compose:
  service:
    name: auth-ui
    port: 4201
    grants:
      secrets: []
    config: {}
    access:
      routes:
      - path: /signin
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /signup
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /forgot-password
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /reset-password
        level: public
        strip: ''
        rewrite: ''
