    required:
    - SERVER_PORT
    optional:
    - AUTH_API_BASE
    - AUTH_REDIRECT_URL
    defaults: {}
    fields: {}
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/auth-ui.git
