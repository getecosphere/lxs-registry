      - path: /verify-email
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /users
        level: role:superadmin
        strip: ''
        rewrite: ''
        cookie: eco_token
      - path: /static/auth-ui.css
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
